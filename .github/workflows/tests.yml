name: Tests

# Runs the unit-test suite on every PR to main (and pushes to main). Build/release stays in
# release.yml (Developer ID / Homebrew) and release-mas.yml (Mac App Store) — this job never
# signs, notarizes, or releases anything.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    # macOS 26 image: same runner both release workflows build on (macOS 26 SDK).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      # app/scripts/test.sh is the canonical test command — CI runs exactly what
      # contributors run locally. It cds into app/ itself (so no working-directory
      # here) and runs `swift test --arch arm64 --no-parallel`. Serial is required,
      # not a preference: several suites share process-global state (NSPasteboard.general,
      # the UserDefaults.standard backup baseline) that Swift Testing's default
      # cross-suite parallelism races, and `.serialized` only orders tests within a
      # suite. DragonKit and ViewInspector resolve from GitHub like any SwiftPM
      # dependency — nothing to vendor. The script leaves CLIPMENU_SPARKLE empty so
      # the test build stays Sparkle-free, which is what UpdaterUITests asserts.
      - name: Tests (ClipMenuTests)
        run: app/scripts/test.sh
